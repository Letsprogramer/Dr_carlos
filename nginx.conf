# =====================================================================
#  Souza Campos Advocacia - configuracao de producao (nginx + Certbot)
#  Servidor : /etc/nginx/sites-available/souzacamposadvise.com.br
#  Site     : /usr/share/nginx/html   (ajuste "root" se for outro caminho)
#  Requer   : /etc/nginx/snippets/souzacampos-security.conf
#             (copia de deploy/nginx-security-headers.conf deste repo)
# =====================================================================

# ---- HTTP: renovacao do Certbot + redireciona o resto para HTTPS -----
server {
    listen 80;
    listen [::]:80;
    server_name souzacamposadvise.com.br www.souzacamposadvise.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: site ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name souzacamposadvise.com.br www.souzacamposadvise.com.br;

    # TLS gerenciado pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/souzacamposadvise.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/souzacamposadvise.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cabecalhos de seguranca (ver nota no proprio snippet sobre repetir
    # o include em cada location que usa add_header)
    include /etc/nginx/snippets/souzacampos-security.conf;

    # SPA: qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome -> cache longo e imutavel
    location /assets/ {
        include /etc/nginx/snippets/souzacampos-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Demais estaticos
    location ~* \.(png|jpg|jpeg|svg|webp|webm|woff2?)$ {
        include /etc/nginx/snippets/souzacampos-security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # index.html sempre revalidado (deploys aparecem na hora)
    location = /index.html {
        include /etc/nginx/snippets/souzacampos-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Bloqueia arquivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml;
}
